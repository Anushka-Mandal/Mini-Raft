services:
  replica1:
    build:
      context: .
      dockerfile: Dockerfile.replica
    hostname: replica1
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      NODE_ID: replica1
      PEERS: http://replica2:4002,http://replica3:4003,http://replica4:4004

  replica2:
    build:
      context: .
      dockerfile: Dockerfile.replica
    hostname: replica2
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      NODE_ID: replica2
      PEERS: http://replica1:4001,http://replica3:4003,http://replica4:4004

  replica3:
    build:
      context: .
      dockerfile: Dockerfile.replica
    hostname: replica3
    ports:
      - "4003:4003"
    environment:
      PORT: 4003
      NODE_ID: replica3
      PEERS: http://replica1:4001,http://replica2:4002,http://replica4:4004

  replica4:
    build:
      context: .
      dockerfile: Dockerfile.replica
    hostname: replica4
    ports:
      - "4004:4004"
    environment:
      PORT: 4004
      NODE_ID: replica4
      PEERS: http://replica1:4001,http://replica2:4002,http://replica3:4003

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    hostname: gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      URLS: http://replica1:4001,http://replica2:4002,http://replica3:4003,http://replica4:4004
    depends_on:
    - replica1
    - replica2
    - replica3
    - replica4
